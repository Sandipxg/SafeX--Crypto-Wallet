services:
  postgres:
    image: postgres:16-alpine
    container_name: safex-postgres
    restart: always
    environment:
      POSTGRES_USER: safex
      POSTGRES_PASSWORD: safexpassword
      POSTGRES_DB: safex_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safex -d safex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
